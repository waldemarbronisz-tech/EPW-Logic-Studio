name: Pytest

# feat/clipboard-and-align CI-flake fix: `on: [push, pull_request]` ran
# this workflow TWICE per commit on a branch with an open PR — once for
# `push` (any branch) and once for `pull_request` (synchronize) — the
# exact same job definition both times, just two independent, and
# therefore independently flaky, chances for a timing-sensitive test to
# fail. main is protected by `push`; every other branch is covered once,
# via its PR.
on:
  push:
    branches: [main]
  pull_request:

# fix/trend-dialog-lifetime: `pull-requests: write` dropped along with the
# "Post failure log to the PR" step below that was its only user — no
# other step here reads or writes PR state.
permissions:
  contents: read

jobs:
  test:
    # fix/ci-pin-runner-and-pyside6: pinned to a specific LTS instead of
    # the floating "ubuntu-latest" label — CI started failing with a
    # native crash (exit code 135 / SIGBUS) on every run starting with
    # the very first run after 2026-09-04 20:02 UTC, including on `main`
    # itself with zero code changes of ours in between. `ubuntu-latest`
    # rotating to a newer default image (with newer system Qt/xcb
    # libraries this apt-get-installed set of packages, or PySide6 6.11.2
    # itself, wasn't necessarily built/tested against) is the most likely
    # explanation for a break with no corresponding commit — pinning the
    # OS trades "always newest" for "reproducible", the same reasoning
    # requirements.txt's own PySide6 pin below now follows.
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: 3.12
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libxcb-shape0 libxcb-cursor0
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # fix/ci-pin-runner-and-pyside6: pytest-qt dropped — grepping the
        # whole suite for `qtbot`/pytest-qt turns up zero uses (no test
        # actually needs its fixtures), yet it still hooks into Qt's own
        # plugin/event-loop machinery at import time purely by being
        # installed. Removing a dependency that provides nothing here but
        # extra surface area for no benefit. NOTE (fix/trend-dialog-lifetime):
        # this was originally written while a real crash was still
        # unexplained, framed as "extra surface area for exactly the kind
        # of native crash this CI is currently hunting" — that crash is now
        # root-caused and fixed at its source (a Python reference-cycle bug
        # in ui/panels/watch.py's trend-dialog lifecycle, unrelated to
        # pytest-qt; see AUDIT_REPORT.md §43/§44). pytest-qt wasn't the
        # cause, it just happened to be the most reliable way to trigger
        # the symptom — its own `processEvents()` call after each test ran
        # right when the already-buggy code's last reference could vanish.
        # Left uninstalled anyway since nothing here actually uses it.
        pip install pytest pytest-randomly
    - name: Run Pytest Headless
      env:
        QT_QPA_PLATFORM: offscreen
        # fix/ci-pin-runner-and-pyside6 diagnostic: installs Python's own
        # signal handler for SIGSEGV/SIGBUS/SIGABRT/SIGFPE/SIGILL — prints
        # the Python-level stack frame that was executing at the moment of
        # a native crash BEFORE the process dies, straight into this
        # step's own stdout. This is exactly what made
        # fix/trend-dialog-lifetime's diagnosis possible (AUDIT_REPORT.md
        # §43/§44) — the crash this was originally added for (native,
        # every CI run since 2026-09-05, AUDIT_REPORT.md §34) is now
        # root-caused and fixed, but kept unconditionally: it's a generally
        # useful safety net for the NEXT native crash, not single-use
        # diagnostic scaffolding for this one. Actions' web UI has been
        # refusing to show this repo's raw job logs without signing in, so
        # this is the only way to actually see what's crashing rather than
        # guessing from exit codes alone.
        PYTHONFAULTHANDLER: 1
        # feat/clipboard-and-align §6: QSettings("BroniszLabs", "EPW Logic
        # Studio") falls back to a native, HOME-rooted config location on
        # any test that forgets to inject the `qsettings` fixture (the
        # exact bug class tests/conftest.py's own fixture exists to avoid
        # — see MEMORY.md). Pointing HOME/XDG_CONFIG_HOME at a fresh
        # per-run temp directory means even a future instance of that
        # mistake can't leave state for a later CI run (or a later test
        # within the same run) to trip over — defense in depth on top of
        # the fixture itself, not a replacement for it.
        HOME: ${{ runner.temp }}
        XDG_CONFIG_HOME: ${{ runner.temp }}/.config
      # pytest-randomly (installed above) shuffles test order on every run
      # and prints the seed it used ("Using --randomly-seed=...") at the
      # top of the log — a genuinely different order each run, catching a
      # future order-dependency bug (e.g. a missed `qsettings` injection,
      # see MEMORY.md) automatically instead of only when someone happens
      # to audit for it by hand. A failure here is reproducible locally
      # with `pytest tests/ -p randomly --randomly-seed=<the printed seed>`.
      #
      # fix/ci-pin-runner-and-pyside6 diagnostic: `-v` (one line per test,
      # so the faulthandler dump above lands right after the LAST test
      # that started) and `set -o pipefail` (without it, `| tee`'s own
      # exit code masks pytest's crash/failure exit code, so the step —
      # and this whole diagnostic — would silently report success).
      run: |
        set -o pipefail
        pytest tests/ -v 2>&1 | tee pytest_output.log

    # fix/trend-dialog-lifetime: the "Post failure log to the PR" step that
    # used to live here is REMOVED, not just edited — its own comment said
    # exactly when to do that: "remove once AUDIT_REPORT.md §34's crash is
    # actually root-caused and fixed — this is a diagnostic aid, not a
    # permanent feature of this workflow." That crash (native, every CI run
    # since 2026-09-05) is now root-caused and fixed (AUDIT_REPORT.md
    # §43/§44 resolution) — its own stated removal condition is met. If
    # GitHub's raw-log-viewer sign-in issue that motivated it recurs for a
    # different failure, re-add it fresh against whatever's actually
    # failing then, rather than reviving this one.
